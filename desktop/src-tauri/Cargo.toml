[package]
name = "synapse-desktop"
version = "0.0.0"
description = "Synapse desktop shell. Presents a local UI; its only runtime connection is the development-only runtime status bridge."
edition = "2021"
publish = false

[lib]
name = "synapse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

# Native folder panel for local project registration. Its default features (xdg-portal, wayland) are Linux-only.
[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17.2", default-features = false }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[features]
# Development-only Python runtime bridge. Off by default and refused for release profiles (see build.rs).
dev-runtime = []

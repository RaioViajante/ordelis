name: Desktop

# Frontend checks and a Tauri compile for the desktop UI foundation.
# Independent of gate.yml; the Python runtime and root npm package are not involved.
on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop UI (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Rust IPC authorization tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Generated permissions match the committed files
        run: git diff --exit-code -- src-tauri/permissions && test -z "$(git ls-files --others --exclude-standard src-tauri/permissions)"

      - name: Build macOS app bundle (debug)
        run: pnpm tauri build --debug --bundles app

name: Desktop

# Frontend checks, Tauri compiles and the development-only runtime bridge checks for the desktop app.
# Runs on desktop changes and on changes to anything the bridge executes. gate.yml still owns the
# full Python/Node/packaging suite on every pull request.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "runtime/**"
      - "tests/test_runtime_status_bridge.py"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "runtime/**"
      - "tests/test_runtime_status_bridge.py"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request cancels that pull request's earlier run. Pushes to main and manual
# runs each get their own group, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: Desktop UI (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (minimum supported by the runtime)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Runtime status entry point tests (Python)
        working-directory: .
        run: python -m unittest tests.test_runtime_status_bridge -v

      - name: Rust tests (default features, bridge unavailable)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Cargo check (default and dev-runtime features)
        run: |
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
          cargo check --locked --all-targets --features dev-runtime --manifest-path src-tauri/Cargo.toml

      - name: Generated permissions match the committed files
        run: git diff --exit-code -- src-tauri/permissions && test -z "$(git ls-files --others --exclude-standard src-tauri/permissions)"

      # CI only: the runner's python.org framework install is group-writable (admin), which the bridge rejects
      # on purpose. This VM is discarded after the job, so tightening it here affects no shared machine.
      # Developers should use a user-owned interpreter instead (docs/implementation/desktop-runtime-bridge.md).
      - name: Select the development interpreter (git-ignored local file)
        run: |
          python -c 'import os, sys; print(os.path.realpath(sys.executable))' > src-tauri/.dev-python
          interpreter="$(cat src-tauri/.dev-python)"
          sudo chmod g-w "$interpreter" "$(dirname "$interpreter")"

      - name: Rust tests with the development runtime bridge
        run: cargo test --locked --features dev-runtime --manifest-path src-tauri/Cargo.toml

      - name: Build macOS app bundle (debug)
        run: pnpm tauri build --debug --bundles app

      # The interpreter file from the previous steps is still present: the release build must ignore it.
      - name: Rust tests with the release profile (default features)
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml

      # Compiler-derived boundary: rustc's dep-info in every configuration must name exactly the files in
      # scripts/native-sources.json, and every resolved dependency must come from crates.io.
      - name: Compiled sources and dependency provenance
        run: node scripts/verify-native-boundary.mjs

      - name: Boundary verifier rejects known bypasses
        run: scripts/test-verify-native-boundary.sh

      - name: Build macOS app bundle (release configuration)
        run: pnpm tauri build --bundles app

      - name: Release bundle holds no development runtime
        run: scripts/verify-release-isolation.sh src-tauri/target/release/bundle/macos/Synapse.app

      # Negative control: the same verifier must reject a real bundle built with the bridge, and its fixture
      # tests must reject missing, invalid or uninspectable executables.
      - name: Build macOS app bundle with the development runtime (negative control, never distributed)
        run: pnpm tauri build --debug --bundles app --features dev-runtime

      - name: Release verifier rejects the development bundle and bad fixtures
        run: scripts/test-verify-release-isolation.sh src-tauri/target/debug/bundle/macos/Synapse.app

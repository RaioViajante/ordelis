name: Bug report
description: Report something that is broken or a documentation error.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Ordelis is in early development and maintained on a best-effort basis; see [SUPPORT.md](https://github.com/RaioViajante/ordelis/blob/main/SUPPORT.md).

        **Do not report security vulnerabilities here.** Use the private route in the [security policy](https://github.com/RaioViajante/ordelis/security/policy).

        **Do not paste** credentials, tokens, raw agent transcripts, provider output, shell snapshots, personal file paths or other sensitive data. Describe or redact them.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app
        - Runtime / agent integrations (the `mco` command and `runtime/`)
        - Documentation
        - Build / CI
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened, and what did you expect?
      description: For a documentation error, name the page and what is wrong or unclear.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands or actions, in order. Say if it happens every time.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and the commit or branch you used. Add tool versions (Python, Node, Rust) only if they could matter.
      placeholder: |
        - OS:
        - Commit or branch:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots (optional)
      description: Short, redacted excerpts only.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: This is not a security vulnerability, and I removed credentials, tokens, transcripts and personal paths.
          required: true
